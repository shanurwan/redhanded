<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedHanded</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<aside>
  <form id="scan">
    <input id="pkg" aria-label="npm package" placeholder="npm package" spellcheck="false" autocomplete="off" maxlength="260">
  </form>
  <nav id="list"></nav>
  <footer>
    <button id="agent" type="button">Copy MCP config</button>
    <a href="https://github.com/shanurwan/redhanded">GitHub</a>
  </footer>
</aside>
<main id="scan-view" hidden>
  <header>
    <h1 id="name"></h1>
    <button id="run" type="button">Run live</button>
  </header>
  <div id="verdict"></div>
  <p id="explanation"></p>
  <ol id="events"></ol>
  <div id="files"></div>
</main>
</body>
</html>
