[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "redhanded"
version = "0.1.0"
description = "Detonate dependency updates in baited Vultr sandboxes before they merge."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
redhanded = "redhanded.cli:main"

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]
dev = ["pytest>=8", "mcp==2.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
